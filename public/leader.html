<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leader Stock Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Market Leader</p>
          <h1>가격·추세 기반 주도주</h1>
        </div>
        <nav class="top-actions" aria-label="대시보드 메뉴">
          <a class="ghost-btn nav-btn" href="/">메인 대시보드</a>
          <a class="ghost-btn nav-btn active-nav" href="/leader.html">주도주</a>
          <a class="ghost-btn nav-btn" href="/scout.html">정찰병</a>
          <a class="ghost-btn nav-btn" href="/simulator.html">시뮬레이터</a>
          <button id="refreshBtn" class="icon-btn" title="새로고침" aria-label="새로고침">↻</button>
        </nav>
      </header>

      <section class="notice">
        <strong>독립 지표</strong>
        <span>주도주 등급은 재무등급이 아니라 가격·추세 등급입니다. 기존 종합순위와 정찰병 점수에는 가산하지 않습니다.</span>
      </section>

      <section class="score-guide" aria-label="주도주 기준">
        <strong>주도주 100점</strong>
        <span><b>30점</b> 장기추세</span>
        <span><b>30점</b> 시장 상대강도</span>
        <span><b>20점</b> 52주 고점 유지</span>
        <span><b>20점</b> 추세 지속</span>
        <small>A 85+ 핵심 · B 70+ 준주도 · C 50+ 중립 · D 50 미만 약세</small>
      </section>

      <section class="metrics" id="leaderMetrics"></section>

      <section class="screener-strip">
        <div class="section-title screener-title">
          <div>
            <h2>시장 주도주 순위</h2>
            <p id="leaderStatus">시총 상위 100의 2년 가격 추세를 계산합니다.</p>
          </div>
          <button id="refreshLeader" class="ghost-btn">주도주 새로고침</button>
        </div>
        <div class="screener-tools">
          <div class="tabs" id="marketTabs">
            <button class="active" data-market="KOSPI">KOSPI</button>
            <button data-market="KOSDAQ">KOSDAQ</button>
          </div>
          <input id="leaderSearch" type="search" placeholder="주도주 검색">
        </div>
        <div class="screener-summary" id="leaderSummary"></div>
        <div class="table-wrap leader-wrap">
          <table class="leader-table">
            <thead>
              <tr>
                <th><button class="sort-btn" data-leader-sort="rank" type="button">순위 <span data-leader-sort-icon="rank">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="name" type="button">종목 <span data-leader-sort-icon="name">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="score" type="button">주도주 <span data-leader-sort-icon="score">↓</span></button></th>
                <th><button class="sort-btn" data-leader-sort="trendScore" type="button">장기추세 <span data-leader-sort-icon="trendScore">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="relativeStrengthScore" type="button">상대강도 <span data-leader-sort-icon="relativeStrengthScore">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="highRetentionScore" type="button">고점유지 <span data-leader-sort-icon="highRetentionScore">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="persistenceScore" type="button">추세지속 <span data-leader-sort-icon="persistenceScore">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="drawdown52wPct" type="button">52주 고점대비 <span data-leader-sort-icon="drawdown52wPct">↕</span></button></th>
                <th><button class="sort-btn" data-leader-sort="ret60" type="button">60일/120일 <span data-leader-sort-icon="ret60">↕</span></button></th>
                <th>종합판정</th>
                <th>정찰병</th>
                <th>판정</th>
              </tr>
            </thead>
            <tbody id="leaderRows">
              <tr><td colspan="12" class="loading">주도주 계산 중...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/leader.js"></script>
  </body>
</html>

name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check server-core.mjs
          node --check ai-review-service.js
          node --check ai-review-store.js
          node --check ai-review-http-hook.mjs
          node --check candidate-freshness-service.js
          node --check cloud-dashboard-runtime.js
          node --check simulation-category.js
          node --check strategy-oos-registry.js
          node --check strategy-oos-tracker.js
          node --check market-index-tracker.js
          node --check simulation-v2-service.js
          node --check public/home-ai-review.js
          node --check public/home-candidate-freshness.js
          node --check public/index-entry-review.js
          node --check public/index-entry-review-core.js
          node --check public/simulator.js
          node --check public/simulator-v2.js
          node --check public/simulation-v2.js
          node --check public/simulator-strategy-candidates.js
          node --check public/entry-review-candidates.js
          node --check public/strategy-candidate-engine.js
          node --check public/strategy-consensus.js
          node --check public/strategy-consensus-cohorts.js
          node --check public/strategy-validation.js
          node --check public/simulation-category.js
          node --check public/strategy-oos-registry.js
          node --check backtest-v3/consensus.mjs
          node --check backtest-consensus-v3.mjs
          node --check deploy/cloud/github-ci-gate.mjs
          bash -n deploy/cloud/update.sh
          bash -n deploy/cloud/backup.sh
          bash -n deploy/cloud/auto-update.sh
      - name: Tests
        run: npm test

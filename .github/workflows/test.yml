name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check cloud-dashboard-runtime.js
          node --check public/simulator.js
          node --check public/simulator-strategy-candidates.js
          node --check public/strategy-candidate-engine.js
          node --check public/strategy-oos-registry.js
      - name: Tests
        run: npm test

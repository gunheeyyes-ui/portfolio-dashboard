name: apply-simulation-v2-final-review

on:
  push:
    branches: [chatgpt/simulation-v2-final-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/simulation-v2-final-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final review patches
        run: node tools/apply-simulation-v2-final-review.mjs
      - name: Syntax checks
        run: |
          node --check simulation-v2-service.js
          node --check strategy-oos-tracker.js
          node --check public/simulator-v2.js
          node --check server.mjs
          node --check simulation-v2-final-review.test.mjs
      - name: Tests
        run: npm test
      - name: Commit reviewed sources
        run: |
          rm -f tools/apply-simulation-v2-final-review.mjs .github/workflows/apply-simulation-v2-final-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation-v2-service.js strategy-oos-tracker.js public/simulator-v2.js server.mjs simulation-v2-final-review.test.mjs tools/apply-simulation-v2-final-review.mjs .github/workflows/apply-simulation-v2-final-review.yml
          git diff --cached --check
          git commit -m "Finalize Simulation V2 correctness and diagnostics"
          git push origin HEAD:chatgpt/simulation-v2-final-review

name: apply-simulation-v2-hardening

on:
  push:
    branches: [chatgpt/simulation-v2-hardening-3]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/simulation-v2-hardening-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted patches
        run: node tools/apply-simulation-v2-hardening.mjs
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check strategy-oos-tracker.js
          node --check simulation-v2-service.js
          node --check market-index-tracker.js
          node --check public/strategy-consensus.js
      - name: Tests
        run: npm test
      - name: Commit patched sources
        run: |
          rm tools/apply-simulation-v2-hardening.mjs
          rm .github/workflows/apply-simulation-v2-hardening.yml
          git config user.name "chatgpt-simulation-v2"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden Simulation V2 OOS data pipeline"
          git push origin HEAD:chatgpt/simulation-v2-hardening-3

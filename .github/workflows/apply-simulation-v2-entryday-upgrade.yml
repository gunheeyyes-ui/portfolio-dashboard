name: apply-simulation-v2-entryday-upgrade

on:
  push:
    branches: [chatgpt/simulation-v2-final-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/simulation-v2-final-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply persistence fix
        run: node tools/apply-simulation-v2-entryday-upgrade.mjs
      - name: Syntax checks
        run: |
          node --check strategy-oos-tracker.js
          node --check simulation-v2-entryday-upgrade.test.mjs
      - name: Tests
        run: npm test
      - name: Commit persistence fix
        run: |
          rm -f tools/apply-simulation-v2-entryday-upgrade.mjs .github/workflows/apply-simulation-v2-entryday-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy-oos-tracker.js simulation-v2-entryday-upgrade.test.mjs tools/apply-simulation-v2-entryday-upgrade.mjs .github/workflows/apply-simulation-v2-entryday-upgrade.yml
          git diff --cached --check
          git commit -m "Persist 0D universe benchmark upgrades"
          git push origin HEAD:chatgpt/simulation-v2-final-review
